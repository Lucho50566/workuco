<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="Mirá los avisos de empleo del Valle de Uco como flyers: deslizá, guardá los que te gustan y deslizá la barra para postularte.">
  <meta name="theme-color" content="#0b1612">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="flyers" class="flyers-page">
{{NAV}}
<main class="feed-wrap" id="feed-wrap">
  <div class="feed-bg" id="feed-bg" aria-hidden="true"></div>
  <h1 class="sr-only">Modo flyers: avisos de empleo del Valle de Uco</h1>
  <div class="feed-top">
    <button class="feed-pill" type="button" id="feed-place" aria-expanded="false" aria-controls="feed-menu">{{ICON_PIN}}<span>Todo el Valle</span></button>
    <div class="feed-menu" id="feed-menu" role="group" aria-label="Filtrar avisos" hidden>
      <button type="button" data-feed-filter="" aria-pressed="true">Todo el Valle</button>
      <button type="button" data-feed-filter="San Carlos" aria-pressed="false">San Carlos</button>
      <button type="button" data-feed-filter="Tunuyán" aria-pressed="false">Tunuyán</button>
      <button type="button" data-feed-filter="Tupungato" aria-pressed="false">Tupungato</button>
      <button type="button" data-feed-filter="gig" aria-pressed="false">Changas</button>
    </div>
  </div>
  <div class="feed" id="feed" tabindex="0" aria-label="Avisos: deslizá hacia arriba para ver el siguiente">
    <div class="fslide fslide-loading"><div class="skeleton"></div></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
