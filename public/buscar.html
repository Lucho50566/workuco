<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="Buscá empleos en San Carlos, Tunuyán y Tupungato. Filtrá por categoría, modalidad y tipo de contrato.">
  <meta name="theme-color" content="#0ba37c">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="search">
{{NAV}}
<main class="container search-page">
  <div class="search-page-head">
    <div>
      <span class="kicker">Búsquedas del Valle</span>
      <h1>Encontrá tu próximo trabajo</h1>
      <p class="results-count" id="results-count">Cargando ofertas…</p>
    </div>
    <div class="search-sort">
      <label for="f-sort" class="sr-only">Ordenar</label>
      <select class="input" id="f-sort">
        <option value="recent">Más recientes primero</option>
        <option value="old">Más antiguas primero</option>
      </select>
    </div>
  </div>

  <form class="search-main" id="filters-form" role="search">
    <div class="search-main-input">
      <span class="field-ico" aria-hidden="true">{{ICON_SEARCH}}</span>
      <input class="input" id="f-q" name="q" type="search" placeholder="Puesto, empresa o palabra clave" autocomplete="off">
    </div>
    <button class="btn btn-primary" type="submit">Buscar</button>
    <button class="btn btn-outline filters-toggle" type="button" data-filters-toggle>{{ICON_FILTER}} Filtros</button>
  </form>

  <div class="filter-panel" id="filters-box">
    <div class="filter-row">
      <span class="filter-label">Localidad</span>
      <div class="filter-chips" id="chips-locality"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Categoría</span>
      <div class="filter-chips" id="chips-category"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Modalidad</span>
      <div class="filter-chips" id="chips-modality"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Tipo</span>
      <div class="filter-chips" id="chips-type"></div>
    </div>
    <button class="btn btn-ghost btn-sm" type="button" id="clear-filters">Limpiar filtros</button>
  </div>

  <div class="results-list" id="results" aria-live="polite"></div>
  <div class="load-more" id="load-more-wrap" hidden>
    <button class="btn btn-outline" id="load-more" type="button">Ver más ofertas</button>
  </div>
</main>
{{FOOTER}}
<script src="/app.js"></script>
</body>
</html>
