<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1612">
  <title>Sin conexión · WorkUco</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #0b1612; color: #f5f1e6; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 26px; margin: 18px 0 6px; letter-spacing: -.02em; }
    p { color: #a9bcb1; margin: 0 0 22px; max-width: 320px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 22px; background: #c8f560; color: #0b1612; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="WorkUco">
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva la señal, tocá el botón y seguís donde estabas.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
